<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .tab-buttons {
            display: flex;
            background: #f5f5f5;
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab-btn.active {
            background: white;
            color: #4a7c9e;
        }

        .tab-btn:first-child.active {
            color: #4a7c9e;
        }

        .tab-btn:last-child.active {
            color: #c8763f;
        }

        .form-container {
            padding: 40px 35px;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 26px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4a7c9e;
        }

        .signin-form input:focus {
            border-color: #4a7c9e;
        }

        .signup-form input:focus {
            border-color: #c8763f;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            color: white;
        }

        .signin-btn {
            background: #4a7c9e;
        }

        .signin-btn:hover {
            background: #3d6680;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 124, 158, 0.3);
        }

        .signup-btn {
            background: #c8763f;
        }

        .signup-btn:hover {
            background: #a86234;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 118, 63, 0.3);
        }

        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-password a {
            color: #4a7c9e;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showForm('signin')">Sign In</button>
            <button class="tab-btn" onclick="showForm('signup')">Sign Up</button>
        </div>

        <div class="form-container">
            <div class="form-content signin-form active">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password">
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
                <button class="submit-btn signin-btn">Sign In</button>
            </div>

            <div class="form-content signup-form">
                <h2>Create Account</h2>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password">
                </div>
                <button class="submit-btn signup-btn">Sign Up</button>
            </div>
        </div>
    </div>

    <script>
        function showForm(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.form-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));
            
            if (type === 'signin') {
                tabs[0].classList.add('active');
                document.querySelector('.signin-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.querySelector('.signup-form').classList.add('active');
            }
        }
    </script>
</body>
</html>
